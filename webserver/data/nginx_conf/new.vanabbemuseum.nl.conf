server {
    listen 80;
    server_name new.vanabbemuseum.nl www.new.vanabbemuseum.nl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot/new.vanabbemuseum.nl;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name new.vanabbemuseum.nl www.new.vanabbemuseum.nl;

    ssl_certificate /etc/letsencrypt/live/new.vanabbemuseum.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.vanabbemuseum.nl/privkey.pem;

    include /etc/nginx/includes/options-ssl-nginx.conf;

    ssl_dhparam /etc/nginx/sites/ssl/ssl-dhparams.pem;

    include /etc/nginx/includes/hsts.conf;

    include /etc/nginx/vhosts/new.vanabbemuseum.nl.conf;
}
