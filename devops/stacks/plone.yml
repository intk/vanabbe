version: "3.3"

# See https://github.com/plone/plone-backend/tree/6.0.x
# https://pkg.go.dev/github.com/robfig/cron?utm_source=godoc
# https://github.com/mcuadros/ofelia

services:
  frontend:
    image: intkbv/vanabbemuseum-frontend:Bugfixes
    environment:
      RAZZLE_INTERNAL_API_PATH: http://backend:8080/Plone
      RAZZLE_DEV_PROXY_API_PATH: http://backend:8080/Plone
    depends_on:
      - backend
    networks:
      # - nw-webserver
      - backend
    ports:
      - 3000:3000
    deploy:
      replicas: 2

  backend:
    image: intkbv/vanabbemuseum-backend:Bugfixes
    environment:
      ZEO_ADDRESS: zeo:8100
      # ADDONS: "kaitconcept.seo"
      # ADDONS: "collective.volto.cookieconsent collective.volto.formsupport"
      #/app/src/collective.previewimage -e
      DEVELOP: "/app/src/intk_vanabbe"
    volumes:
      - vanabbe-cache:/data
      - /var/local/vanabbe:/app/logs
      # - /var/local/vanabbe/backend/src:/app/src
      # - /var/local/vanabbe/data-import:/data-import
    networks:
      # - nw-webserver
      - backend
    ports:
      - 8080:8080
    deploy:
      replicas: 4

  zeo:
    image: plone/plone-zeo:latest
    # ports:
    #   - "8100:8100"
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.weekly-backup.schedule: "0 0 2 * * 0"
      ofelia.job-exec.weekly-backup.command: "/app/bin/repozo -B -f /app/var/filestorage/Data.fs -r /app/var/backup"
    volumes:
      - /var/local/vanabbe/data:/data
    networks:
      # - nw-webserver
      - backend

  # See https://github.com/mcuadros/ofelia
  ofelia:
    image: mcuadros/ofelia:latest
    # restart: always
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # profiles: ["production"]

volumes:
  vanabbe-cache:
    external: true
  vol-traefik-public-certificates:
    driver_opts:
      type: none
      device: /data/traefik/certificates
      o: bind
  vol-traefik-config:
    driver_opts:
      type: none
      device: /data/traefik/config
      o: bind
networks:
  # nw-webserver:
  #   external: true
  #   driver: overlay
  backend:
    driver: overlay
